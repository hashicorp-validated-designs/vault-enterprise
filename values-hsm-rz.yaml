# ==============================================================================
# HVD: Vault Enterprise on OpenShift - Reference values.yaml
# Profile: Self-managed OpenShift, 6-pod redundancy zones
# Seal:    HSM auto-unseal over PKCS#11 (example: Thales Luna)
# ==============================================================================
#
# This profile adds HSM-backed auto-unseal to the 6-pod redundancy-zones
# topology. Auto-unseal lets rescheduled pods return to service without operator
# intervention. The HSM vendor's PKCS#11 library must be present at a fixed path
# inside the Vault container before Vault starts.
#
# Library delivery (HVD: HSM client library delivery to Vault Pods):
# This file uses the init-container pattern, the HVD's default recommendation.
# The Vault container runs the stock hashicorp/vault-enterprise:2.0.2-ent.hsm
# image (Red Hat UBI with glibc) with NO custom build. A separate, digest-pinned
# artifact image ships only the vendor PKCS#11 library; an init container copies
# it into a shared emptyDir that the Vault container mounts read-only. The Vault
# digest plus the artifact digest fully describe what runs in the container, and
# the library updates on its own cadence without rebuilding the Vault image. The
# HVD section covers the custom-image and shared-volume alternatives and their
# trade-offs. Confirm your HSM vendor's PKCS#11 library supports glibc/UBI.
#
# Pre-create these objects before deploying (names match the volumes below):
#   - Artifact image  hsm-pkcs11-luna (digest-pinned; ships the PKCS#11 library)
#   - Secret  vault-tls           (kubernetes.io/tls: tls.crt, tls.key, ca.crt)
#   - Secret  vault-license       (license.hclic)
#   - Secret  hsm-pin             (HSM_PIN)
#   - Secret  hsm-mtls            (HSM client mTLS material, vendor-specific)
#   - Secret  chrystoki-config-path (path -> ChrystokiConfigurationPath)
#   - ConfigMap chrystoki-conf    (Chrystoki.conf for the Luna client)
#
# Replace all <placeholder> values and the example hostname/namespace before use.
# ------------------------------------------------------------------------------

global:
  enabled: true
  tlsDisable: false
  openshift: true

server:
  enabled: true

  enterpriseLicense:
    secretName: "vault-license"
    secretKey: "license.hclic"

  image:
    # Stock Vault Enterprise HSM image (Red Hat UBI with glibc) — no custom build.
    # The PKCS#11 library is delivered by the init container, not baked in here.
    # Red Hat certified UBI build, pinned by digest for immutability.
    repository: "registry.connect.redhat.com/hashicorp/vault-enterprise"
    tag: "2.0.2-ent.hsm-ubi@sha256:108d8bd87f19a2aca7d354ae3f6d8841523d842ccf0d4ff87a135b14f6d06add"
    # Alternative: the same HSM (UBI) build on Docker Hub.
    # repository: "docker.io/hashicorp/vault-enterprise"
    # tag: "2.0.2-ent.hsm@sha256:f9c4b7dbe0a37c76f3b80ce4802d72ccdfdb69d11bc89f2d93cc14602569c877"
    # IfNotPresent is the Helm chart default.
    pullPolicy: IfNotPresent

  logLevel: info
  logFormat: json

  # Give Vault time to seal and shut down cleanly on eviction or termination.
  # The chart default of 10 is too low; the active node may still be sealing.
  # Run `vault operator step-down` before a planned drain (HVD: Node placement).
  terminationGracePeriodSeconds: 120

  # updateStrategyType defaults to OnDelete (chart default), which the HVD upgrade
  # procedure relies on so you control the Pod deletion order. Keep the default.
  # updateStrategyType: "OnDelete"

  # ----------------------------------------------------------------------------
  # Resource management (HVD: Resource management)
  # Assumes dedicated Vault nodes (recommended): memory request == limit, a CPU
  # request, and no CPU limit so Vault can burst (Burstable QoS). On shared nodes,
  # set the CPU limit EQUAL to the CPU request (uncomment below) for Guaranteed
  # QoS, which protects Vault under co-tenant memory pressure at the cost of CPU
  # throttling. Size from vault-benchmark peak, not steady state.
  # ----------------------------------------------------------------------------
  resources:
    requests:
      memory: 16Gi
      cpu: 2000m
    limits:
      memory: 16Gi
      # Dedicated nodes: omit the CPU limit (Burstable QoS).
      # Shared nodes: set cpu equal to requests.cpu for Guaranteed QoS.
      # cpu: 2000m

  # Rank Vault above application workloads but below system-critical pods.
  # Create the PriorityClass separately (preemptionPolicy: Never recommended).
  # On shared nodes this is strongly recommended (more workloads compete).
  # priorityClassName: "vault-critical"

  # Target dedicated Vault nodes (recommended for production). Uncomment and
  # adapt to your node labels/taints. On shared nodes, omit these and rely on
  # resource requests, limits, and PriorityClass instead.
  # nodeSelector:
  #   node-role.kubernetes.io/vault: ""
  # tolerations:
  #   - key: "dedicated"
  #     operator: "Equal"
  #     value: "vault"
  #     effect: "NoSchedule"

  # Storage (HVD: Storage topology). Each pod gets its own RWO PVC on a
  # low-latency, high-IOPS class. Never use RWX/NFS for integrated storage.
  dataStorage:
    # enabled, mountPath, accessMode are chart defaults; chart default size is
    # 10Gi, raised here for production Raft data growth.
    enabled: true
    size: 200Gi
    mountPath: "/vault/data"
    # Set an explicit RWO block StorageClass; do not rely on a cluster default
    # (HVD: Storage topology — target p99 put < 10ms, get < 5ms). For OpenShift
    # Data Foundation use ocs-storagecluster-ceph-rbd (internal) or
    # ocs-external-storagecluster-ceph-rbd (external). Never use CephFS/NFS (RWX).
    storageClass: "<storage-class-name>"
    accessMode: ReadWriteOnce

  # No audit PVC: keep pods ephemeral. Enable audit devices at runtime with
  # `vault audit enable` — a `file` device to stdout plus a `socket` device to an
  # external collector, so one pipeline failure cannot block Vault (HVD: audit
  # logs). auditStorage.enabled is false by default (chart default), set here for
  # explicitness so audit logs are never backed by a PVC.
  auditStorage:
    enabled: false

  # ----------------------------------------------------------------------------
  # Services (HVD: Service topology). <release> targets all pods (client API 8200,
  # cluster 8201); <release>-active the active pod (used for replication);
  # <release>-standby is disabled (client traffic uses <release>, replication uses
  # <release>-active).
  #
  # server.service.type applies to BOTH the main and active Services (no
  # per-service type; ClusterIP is the chart default). LoadBalancer exposes the
  # active Pod on 8200/8201 for cross-cluster replication AND puts the all-pods
  # client Service behind a load balancer in addition to the Route. Prefer the
  # INTERNAL load balancer annotations below; the chart does not expose
  # loadBalancerSourceRanges, so restrict access with platform controls or a
  # NetworkPolicy.
  # ----------------------------------------------------------------------------
  service:
    enabled: true
    type: LoadBalancer
    # Internal load balancer annotations apply to all chart Services. On-premises
    # with MetalLB, pin an address pool (adapt to your platform).
    # annotations:
    #   metallb.universe.tf/address-pool: vault-internal
    active:
      enabled: true
    standby:
      enabled: false

  # ----------------------------------------------------------------------------
  # External access (HVD: OpenShift Routes)
  # Passthrough preserves end-to-end TLS; the client validates Vault's listener
  # certificate directly. activeService: false routes to all pods so performance
  # standbys serve reads locally. The listener certificate MUST carry a SAN that
  # matches `host`.
  # ----------------------------------------------------------------------------
  route:
    enabled: true
    activeService: false
    host: "vault.apps.example.com"
    tls:
      termination: passthrough

  # ----------------------------------------------------------------------------
  # Health probes (HVD: Health endpoint monitoring)
  # Readiness treats standby / perf-standby / DR-secondary as ready.
  # Liveness additionally treats sealed / uninitialized as healthy so the
  # kubelet does not restart pods that are operating as designed.
  # ----------------------------------------------------------------------------
  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&perfstandbyok=true&drsecondarycode=200"
    port: 8200
    initialDelaySeconds: 15
    periodSeconds: 5
    failureThreshold: 2
    successThreshold: 1

  # The Helm chart disables the liveness probe by default. Enable it so the
  # kubelet restarts a wedged pod, using a path that tolerates Vault's expected
  # non-ready states (sealed, uninitialized, standby). sealedcode=204 keeps a
  # sealed pod alive so an HSM connectivity blip during unseal does not trigger a
  # restart loop.
  livenessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&perfstandbyok=true&drsecondarycode=200&sealedcode=204&uninitcode=204"
    port: 8200
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 2
    successThreshold: 1

  # ----------------------------------------------------------------------------
  # Pod placement (HVD: Anti-affinity, Pod topology spread constraints)
  # The chart does not derive topologySpreadConstraints from redundancyZones (the
  # default is empty; with RZ enabled and this unset the chart emits a NOTES
  # warning). Set it so the scheduler enforces the 2-2-2 zone spread
  # (DoNotSchedule) instead of the soft cluster-level default (ScheduleAnyway).
  # The chart's default podAntiAffinity (kubernetes.io/hostname) stays in place;
  # if you set server.affinity, re-include it to keep pods on separate nodes.
  topologySpreadConstraints: |
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: {{ template "vault.name" . }}
          app.kubernetes.io/instance: {{ .Release.Name }}
          component: server

  ha:
    enabled: true
    replicas: 6
    # api_addr advertised for client request redirection (chart default shown).
    # $(POD_IP) comes from the Downward API at startup, so it is correct for any
    # release name and re-evaluated on restart. Do not hardcode a pod-DNS name;
    # the chart does not run server.ha.apiAddr through tpl.
    apiAddr: "https://$(POD_IP):8200"

    raft:
      enabled: true
      setNodeId: true

      # Vault Enterprise redundancy zones. The chart reads the node's
      # topology.kubernetes.io/zone label and injects it as VAULT_REDUNDANCY_ZONE
      # (used by autopilot_redundancy_zone below). Requires OpenShift 4.22+
      # (Kubernetes 1.35+) for the PodTopologyLabels admission controller; the
      # chart fails to render on Kubernetes below 1.35.
      redundancyZones:
        enabled: true

      config: |
        ui = true
        cluster_name = "vault-prd-dc1-a"

        listener "tcp" {
          tls_disable     = false
          tls_cert_file   = "/vault/userconfig/vault-tls/tls.crt"
          tls_key_file    = "/vault/userconfig/vault-tls/tls.key"
          tls_min_version = "tls12"
          tls_disable_client_certs = true

          address         = "[::]:8200"
          cluster_address = "[::]:8201"

          telemetry {
            unauthenticated_metrics_access = true
          }
        }

        # Recommended with integrated storage on Kubernetes: disable mlock and
        # protect Vault memory from swap at the node level instead. See:
        # https://developer.hashicorp.com/vault/tutorials/kubernetes/kubernetes-security-concerns#protect-vault-memory-from-swap
        disable_mlock = true

        storage "raft" {
          path = "/vault/data"

          # Substituted from the VAULT_REDUNDANCY_ZONE env var at startup.
          autopilot_redundancy_zone = "VAULT_REDUNDANCY_ZONE"

          retry_join {
            auto_join             = "provider=k8s namespace={{ .Release.Namespace }} label_selector=\"app.kubernetes.io/name={{ template "vault.name" . }}, component=server\""
            auto_join_scheme      = "https"
            leader_ca_cert_file   = "/vault/userconfig/vault-tls/ca.crt"
            # Must match a SAN on the listener certificate.
            leader_tls_servername = "vault.apps.example.com"
          }
        }

        service_registration "kubernetes" {}

        telemetry {
          prometheus_retention_time = "12h"
          disable_hostname          = true
        }

        # PKCS#11 HSM auto-unseal. The empty stanza selects the pkcs11 seal;
        # the parameters are supplied through the VAULT_HSM_* environment
        # variables below (which override stanza fields) so the HSM PIN never
        # renders into the ConfigMap. See:
        # https://developer.hashicorp.com/vault/docs/configuration/seal/pkcs11
        seal "pkcs11" {}

      # disruptionBudget.enabled is the chart default. With redundancy zones the
      # chart already defaults maxUnavailable to 1 (not ⌊(n-1)/2⌋) because the PDB
      # cannot tell voters from non-voters; set here for explicitness. Keep it at 1.
      disruptionBudget:
        enabled: true
        maxUnavailable: 1

  # ----------------------------------------------------------------------------
  # HSM seal parameters (non-sensitive) and TLS CA path. Mechanism values are
  # vendor-specific; the examples are CKM_AES_CBC (0x1082) and CKM_SHA256_HMAC
  # (0x0251). Adjust labels, slot, and library path to match your HSM partition
  # and where the init container places the library (the hsm-lib mount).
  # ----------------------------------------------------------------------------
  extraEnvironmentVars:
    # VAULT_CACERT: the chart sets VAULT_ADDR=https://127.0.0.1:8200 with TLS on,
    # so the in-pod CLI (init/unseal/raft through `oc exec`) needs the CA to trust
    # the listener. Listener cert SANs must include the Route hostname, the Service
    # DNS name, and 127.0.0.1. Mounted under /vault/userconfig; /vault/config is
    # reserved.
    VAULT_CACERT: /vault/userconfig/vault-tls/ca.crt
    # OPTIONAL (HVD: Certificate Trust and TLS). Point Vault's OUTBOUND TLS trust
    # at the cluster-wide CA bundle injected by OpenShift (see the optional
    # vault-trusted-ca volume below). Safe because that bundle MERGES the system
    # (public) CAs with your custom CAs. Independent of HSM trust (the Luna client
    # validates the HSM through Chrystoki.conf). Enable only if Vault must reach
    # internal-CA endpoints (egress proxy, OIDC, LDAP). Uncomment with the volume.
    # SSL_CERT_FILE: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
    VAULT_SEAL_TYPE: "pkcs11"
    VAULT_HSM_LIB: "/opt/hsm/lib/libCryptoki2_64.so"
    VAULT_HSM_SLOT: "0"
    VAULT_HSM_KEY_LABEL: "<vault-prd-dc1-a_CKM_AES_CBC>"
    VAULT_HSM_HMAC_KEY_LABEL: "<vault-prd-dc1-a_CKM_SHA256_HMAC>"
    # https://developer.hashicorp.com/vault/docs/configuration/seal/pkcs11#mechanism
    VAULT_HSM_MECHANISM: "0x1082"        # CKM_AES_CBC
    VAULT_HSM_HMAC_MECHANISM: "0x0251"   # CKM_SHA256_HMAC
    # Set to "true" ONLY for first-time key creation during initial cluster
    # bring-up. Set back to "false" afterwards to prevent unintended key creation.
    VAULT_HSM_GENERATE_KEY: "false"

  # HSM environment variables sourced from Secrets. VAULT_HSM_PIN is sensitive and
  # must never render into Helm values, the StatefulSet manifest, or a ConfigMap.
  extraSecretEnvironmentVars:
    - envName: VAULT_HSM_PIN
      secretName: hsm-pin
      secretKey: HSM_PIN
    # ChrystokiConfigurationPath is the Luna client config path and is NOT
    # sensitive. It is set here rather than in extraEnvironmentVars because the
    # chart upper-cases extraEnvironmentVars keys (rendering
    # CHRYSTOKICONFIGURATIONPATH), while extraSecretEnvironmentVars preserves the
    # exact mixed-case name the Luna PKCS#11 library requires.
    - envName: ChrystokiConfigurationPath
      secretName: chrystoki-config-path
      secretKey: path

  # ----------------------------------------------------------------------------
  # Init-container library delivery (HVD: HSM client library delivery to Vault
  # Pods). A digest-pinned artifact image ships the vendor PKCS#11 library on a
  # minimal base with a shell (such as ubi-minimal; the copy below needs sh, cp,
  # chmod). The init container copies the library into the shared hsm-lib emptyDir
  # as world-readable (a=rX) so it loads under OpenShift's arbitrary UID; the Vault
  # container mounts it read-only at /opt/hsm/lib.
  # ----------------------------------------------------------------------------
  extraInitContainers:
    - name: hsm-pkcs11-lib
      image: "registry.example.com/hsm-pkcs11-luna@sha256:<artifact-image-digest>"
      imagePullPolicy: IfNotPresent
      # Set equal requests and limits so this init container does not downgrade the
      # Pod QoS class (HVD: Resource management — every container, including init
      # containers, must match for Guaranteed QoS on shared nodes).
      resources:
        requests:
          memory: 64Mi
          cpu: 100m
        limits:
          memory: 64Mi
          cpu: 100m
      command: ["sh", "-c"]
      args:
        - |
          set -e
          # Copy the library and any dependencies from the artifact image into the
          # shared volume. Adjust the source path to your artifact image layout.
          cp -a /opt/luna/lib/. /hsm-lib/
          chmod -R a=rX /hsm-lib
      volumeMounts:
        - name: hsm-lib
          mountPath: /hsm-lib

  # ----------------------------------------------------------------------------
  # Volumes: the shared library emptyDir, listener TLS, HSM client configuration,
  # mTLS material, and trust. The init container populates hsm-lib; the Vault
  # container mounts it read-only.
  # ----------------------------------------------------------------------------
  volumes:
    # Pod-scoped scratch volume that carries the PKCS#11 library from the init
    # container to the Vault container. It lives and dies with the Pod.
    - name: hsm-lib
      emptyDir: {}
    - name: vault-tls
      secret:
        secretName: vault-tls
        defaultMode: 0400
    # HSM client mTLS material (client cert/key for the HSM network connection).
    - name: hsm-mtls
      secret:
        secretName: hsm-mtls
    # Non-sensitive HSM client configuration (Chrystoki.conf).
    - name: chrystoki-conf
      configMap:
        name: chrystoki-conf
    # OPTIONAL (HVD: Certificate Trust and TLS). Cluster-wide trusted CA bundle.
    # Pre-create an EMPTY ConfigMap named vault-trusted-ca labelled
    # config.openshift.io/inject-trusted-cabundle="true"; OpenShift populates
    # ca-bundle.crt with system + custom CAs. Pair with SSL_CERT_FILE above.
    # https://docs.redhat.com/en/documentation/openshift_container_platform/4.21/html/configuring_network_settings/configuring-a-custom-pki#certificate-injection-using-operators_configuring-a-custom-pki
    # - name: vault-trusted-ca
    #   configMap:
    #     name: vault-trusted-ca
    #     items:
    #       - key: ca-bundle.crt
    #         path: tls-ca-bundle.pem

  volumeMounts:
    # Delivered PKCS#11 library, read-only. VAULT_HSM_LIB points here.
    - name: hsm-lib
      mountPath: /opt/hsm/lib
      readOnly: true
    - name: vault-tls
      mountPath: /vault/userconfig/vault-tls
      readOnly: true
    - name: hsm-mtls
      mountPath: /opt/vault/hsm-mtls
      readOnly: true
    - name: chrystoki-conf
      mountPath: /var/usrlocal/luna/config
      readOnly: true
    # OPTIONAL: mount the injected cluster-wide CA bundle that SSL_CERT_FILE points
    # at. Uncomment with the vault-trusted-ca volume and SSL_CERT_FILE above.
    # - name: vault-trusted-ca
    #   mountPath: /etc/pki/ca-trust/extracted/pem
    #   readOnly: true

  serviceAccount:
    create: true
    # serviceDiscovery.enabled: true is the Helm chart default; required for
    # service_registration and auto_join pod discovery. Shown for explicitness.
    serviceDiscovery:
      enabled: true

# UI: the OpenShift Route already serves the Vault UI through the <release>
# Service, and `ui = true` in the config enables the UI itself. ui.enabled is
# false (chart default), so no separate <release>-ui Service is created. Enable
# it only if you need a dedicated in-cluster UI Service.
ui:
  enabled: false

injector:
  enabled: false

csi:
  enabled: false

# ------------------------------------------------------------------------------
# Telemetry (HVD: Metrics collection on OpenShift)
# Create a ServiceMonitor and scrape ALL pods (matchLabels vault-internal:true),
# not just the active pod, so standby/perf-standby metrics are collected.
# Requires the Prometheus Operator CRDs to be installed first.
# ------------------------------------------------------------------------------
serverTelemetry:
  serviceMonitor:
    enabled: true
    # interval and scrapeTimeout are shown at their Helm chart defaults.
    interval: 30s
    scrapeTimeout: 10s
    selectors:
      release: prometheus
    matchLabels:
      vault-internal: "true"
